    linear-gradient(180deg,rgba(7,3,10,.44) 0%,rgba(7,3,10,.26) 18%,rgba(7,3,10,.14) 34%,rgba(6,3,9,.52) 60%,rgba(4,2,7,.78) 100%)}
.veil::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.5}

/* ---------- 骨架 ---------- */
.app{position:relative;z-index:2;width:100%;max-width:1320px;margin:0 auto;
  padding:16px 14px 30px;display:flex;flex-direction:column;gap:14px;min-height:100vh}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,158,199,.55),rgba(255,45,85,.35),transparent)}

/* ---------- 顶栏 ---------- */
.topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;min-width:0;
  padding:14px 18px;border-radius:20px}
.brand{display:flex;flex-direction:column;gap:7px;min-width:0}
.brand b{font-size:17.5px;font-weight:800;letter-spacing:.6px;line-height:1.1;
  background:linear-gradient(96deg,#fff 8%,#ffc6de 46%,#ff4d7d 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(255,45,85,.45))}
.brand small{font-size:9.5px;letter-spacing:1.6px;color:#9c7f92;font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  font-size:10px;letter-spacing:.5px;color:#ffd3e3;padding:3.5px 10px;border-radius:999px;
  background:rgba(255,45,85,.13);border:1px solid rgba(255,80,120,.42)}
.badge i{width:6px;height:6px;border-radius:50%;background:#ff3358;
  box-shadow:0 0 10px 1px rgba(255,51,88,.9);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.72)}}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-width:0}
.stat{min-width:0;padding:8px 12px;border-radius:13px;
  background:linear-gradient(180deg,rgba(8,4,12,.34),rgba(8,4,12,.16));
  border:1px solid rgba(255,150,195,.10)}
.stat span{display:block;font-size:9.5px;letter-spacing:1.1px;color:var(--dim);text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.6)}
.stat b{display:block;margin-top:3px;font-size:15.5px;font-weight:700;letter-spacing:-.2px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 18px rgba(255,120,170,.25)}
#s-pnl{font-size:12.5px;line-height:1.18;white-space:normal}

.ctrl{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;min-width:0}

/* ---------- 按钮 ---------- */
button{font-family:inherit;font-size:13px;color:#f0dae7;cursor:pointer;
  padding:8px 13px;border-radius:11px;border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(66,34,60,.55),rgba(22,11,26,.72));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .12s ease,box-shadow .2s ease,border-color .2s,background .2s;
  -webkit-tap-highlight-color:transparent;white-space:nowrap}
button:hover{border-color:rgba(255,120,175,.62);
  box-shadow:0 0 0 1px rgba(255,120,175,.18),0 10px 24px -14px rgba(255,45,110,.9);
  transform:translateY(-1px)}
button:active{transform:translateY(1px) scale(.988)}
button:focus-visible{outline:2px solid rgba(255,120,175,.7);outline-offset:2px}

.spd.active{background:linear-gradient(180deg,#ff5f8c,#db0f3d);border-color:#ff86ae;color:#fff;
  font-weight:700;box-shadow:0 10px 24px -11px rgba(255,45,85,.95),0 0 0 1px rgba(255,255,255,.14) inset}

#btn-buy{flex:1;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(180deg,#ff5470,#cf0a37);border-color:rgba(255,150,180,.72);
  box-shadow:0 12px 28px -13px rgba(255,30,80,1),0 0 0 1px rgba(255,255,255,.16) inset}
#btn-sell{flex:1;font-weight:800;font-size:14px;color:#e9fff7;
  background:linear-gradient(180deg,#1ec88b,#0b7a55);border-color:rgba(70,235,185,.5);
  box-shadow:0 12px 28px -14px rgba(20,200,140,.9),0 0 0 1px rgba(255,255,255,.12) inset}
.ghost{background:rgba(255,255,255,.025);border-style:dashed;color:#b99aae;flex:1;font-size:12px}
.ghost:hover{color:#ffd6e6;border-color:rgba(255,120,175,.5)}

.mode-btn{font-weight:700;letter-spacing:.3px;color:#ffe6b8;border-color:rgba(255,190,90,.45);
  background:linear-gradient(180deg,rgba(90,58,20,.55),rgba(30,16,10,.75))}
.mode-btn:hover{border-color:rgba(255,200,110,.8);box-shadow:0 0 0 1px rgba(255,190,90,.22),0 10px 24px -14px rgba(255,170,60,.9)}
.mode-btn.on-mode{color:#0b0510;border-color:rgba(255,215,140,.9);
  background:linear-gradient(180deg,#ffd166,#e09b1e);
  box-shadow:0 10px 24px -12px rgba(255,170,60,1),0 0 0 1px rgba(255,255,255,.25) inset}

/* ---------- 风险压迫层 ---------- */
#danger{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;
  transition:opacity .5s ease;animation:dangerPulse 2.6s ease-in-out infinite}
body.risk-1 #danger{opacity:.45}
body.risk-2 #danger{opacity:.75;animation-duration:1.5s}
body.risk-3 #danger{opacity:1;animation-duration:.85s}
@keyframes dangerPulse{
  0%,100%{box-shadow:inset 0 0 80px 0 rgba(255,16,70,.10)}
  50%{box-shadow:inset 0 0 150px 70px rgba(255,16,70,.55)}
}
body.risk-2 .bg{filter:saturate(.6) brightness(.82) sepia(.25) hue-rotate(-18deg)}
body.risk-3 .bg{filter:saturate(.35) brightness(.66) sepia(.4) hue-rotate(-24deg)}
body.risk-3 #s-pnl{animation:shake .5s ease-in-out infinite}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-1.5px)}
  75%{transform:translateX(1.5px)}
}

.riskbar{position:relative;align-self:center;margin:-4px 0 -2px;
  display:flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;
  font-size:12px;letter-spacing:.3px;color:#ffdbe4;white-space:nowrap;
  background:linear-gradient(180deg,rgba(120,8,32,.92),rgba(70,4,20,.92));
  border:1px solid rgba(255,90,120,.55);
  box-shadow:0 10px 30px -12px rgba(255,20,70,.9),0 0 0 1px rgba(255,255,255,.06) inset;
  backdrop-filter:blur(10px)}
.riskbar[hidden]{display:none}
.riskbar .warn{font-size:13px;filter:drop-shadow(0 0 6px rgba(255,60,90,.9))}

/* ---------- 结算 ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:20px;background:radial-gradient(70% 70% at 50% 38%,rgba(90,0,24,.78),rgba(4,2,6,.96));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .45s ease}
.overlay[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.over-card{width:min(440px,100%);padding:26px 24px 22px;border-radius:22px;text-align:center;
  background:linear-gradient(180deg,rgba(48,14,26,.94),rgba(16,6,12,.96));
  border:1px solid rgba(255,90,120,.4);
  box-shadow:0 40px 80px -40px #000,0 0 0 1px rgba(255,255,255,.05) inset,0 0 60px -10px rgba(255,30,80,.5)}
.over-kicker{font-size:10px;letter-spacing:4px;color:#ff6b8c;font-family:var(--mono)}
.over-title{margin-top:8px;font-size:26px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(96deg,#fff,#ff9db4 50%,#ff2d55);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.over-sub{margin-top:6px;font-size:12px;color:#c9a2b2;line-height:1.6}
.over-grid{margin:18px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.over-grid div{padding:9px 10px;border-radius:12px;text-align:left;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,150,190,.14)}
.over-grid span{display:block;font-size:9.5px;letter-spacing:.8px;color:#a98a99}
.over-grid b{display:block;margin-top:3px;font-size:15px;font-family:var(--mono);color:#fff}
.over-anchor{margin:10px 0 4px;font-size:11px;color:#ffb3c4;line-height:1.6}
.over-btn{margin-top:14px;width:100%;padding:12px;border-radius:13px;font-size:14px;font-weight:800;
  color:#fff;border-color:rgba(255,150,180,.7);
  background:linear-gradient(180deg,#ff5470,#cf0a37);
  box-shadow:0 14px 30px -14px rgba(255,30,80,1),0 0 0 1px rgba(255,255,255,.16) inset}

/* ---------- 扩展：音效/挑战/图表/挂单/头条/飘字 ---------- */
.brand-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.icon-btn{width:26px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;font-size:12px;line-height:1;border-radius:8px}
.icon-btn.off{opacity:.4;filter:grayscale(1)}
.icon-btn.on{color:#fff;border-color:rgba(140,230,255,.7);
  background:linear-gradient(180deg,#1e6f96,#0b3c58);
  box-shadow:0 8px 22px -12px rgba(80,200,255,.9)}

.goalbar{position:relative;align-self:center;margin:-4px 0 -2px;display:flex;gap:10px;align-items:center;
  padding:7px 16px;border-radius:999px;font-size:12px;color:#e6f8ff;white-space:nowrap;
  background:linear-gradient(180deg,rgba(10,62,92,.92),rgba(5,26,44,.94));
  border:1px solid rgba(120,220,255,.45);
  box-shadow:0 10px 30px -12px rgba(60,180,255,.85),0 0 0 1px rgba(255,255,255,.05) inset}
.goalbar[hidden]{display:none}
.goalbar b{font-family:var(--mono);color:#fff}

.eq-panel{padding:9px 10px 10px;border-radius:16px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.eq-panel .panel-title{font-size:10px;padding-left:8px;margin-bottom:7px}
#eqchart{width:100%;height:76px;display:block}
#eq-sub{color:#a98a9b}

#limit{flex:0 0 42%;padding:10px 10px;border-radius:11px;color:#fff;font-family:var(--mono);font-size:13px;
  outline:none;background:rgba(0,0,0,.26);border:1px solid var(--line-2)}
#limit:focus{border-color:rgba(255,120,175,.7);box-shadow:0 0 0 3px rgba(255,45,85,.14)}
#limit::placeholder{color:#8f7484;font-family:inherit;font-size:11px}

.orders{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-family:var(--mono)}
.orders:empty{display:none}
.orders .o{display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:4px 8px;border-radius:8px;color:#cbb2c2;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,150,195,.12)}
.orders .o b{color:#fff;font-weight:700}
.orders .o .x{cursor:pointer;color:#ff8fa8;padding:0 2px}

.headline{position:fixed;left:50%;top:14px;z-index:60;max-width:min(780px,92vw);
  padding:11px 20px;border-radius:14px;font-size:13px;line-height:1.5;color:#ffe6ec;
  background:linear-gradient(180deg,rgba(64,8,26,.96),rgba(28,3,12,.97));
  border:1px solid rgba(255,110,140,.6);
  box-shadow:0 20px 44px -20px #000,0 0 44px -10px rgba(255,40,90,.85);
  transform:translate(-50%,-150%);opacity:0;
  transition:transform .38s cubic-bezier(.2,.9,.2,1),opacity .38s}
.headline.show{transform:translate(-50%,0);opacity:1}
.headline[hidden]{display:none}
.headline.good{border-color:rgba(80,235,170,.6);background:linear-gradient(180deg,rgba(6,54,36,.96),rgba(3,24,16,.97));
  color:#dcffee;box-shadow:0 20px 44px -20px #000,0 0 44px -10px rgba(46,230,160,.75)}

.floater{position:fixed;z-index:70;pointer-events:none;font-family:var(--mono);font-weight:800;
  font-size:15px;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.9);
  animation:floatUp 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(8px) scale(.88)}
  14%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-52px) scale(1.02)}}

.toasts{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:8px 14px;border-radius:12px;font-size:12px;color:#fff3e0;
  background:linear-gradient(180deg,rgba(96,62,12,.96),rgba(48,28,2,.96));
  border:1px solid rgba(255,200,110,.65);box-shadow:0 14px 30px -16px #000;
  animation:toastIn .28s ease both,toastOut .45s ease 2.7s both}
@keyframes toastIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(22px)}}

.flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;background:#fff}
.flash.on{animation:flashHit .5s ease-out}
@keyframes flashHit{0%{opacity:0}8%{opacity:.55}100%{opacity:0}}

.over-chart{width:100%;height:72px;margin:12px 0 4px;display:block;opacity:.92}
.over-ach{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
.over-ach i{font-style:normal;font-size:10.5px;padding:4px 9px;border-radius:999px;
  background:rgba(255,200,110,.13);border:1px solid rgba(255,200,110,.42);color:#ffd79a}
.over-trades{max-height:118px;overflow:auto;margin-top:10px;padding-top:8px;text-align:left;
  font-size:10.5px;font-family:var(--mono);border-top:1px solid rgba(255,150,190,.14)}
.over-trades div{display:flex;justify-content:space-between;padding:2px 0;color:#c3a4b6}
.over-trades .up{color:#ff9db4} .over-trades .down{color:#7df0c4}
.over-btns{display:flex;gap:8px;margin-top:14px}
.over-btns .over-btn{flex:1;margin-top:0}
.over-card.win{border-color:rgba(120,255,190,.45);
  box-shadow:0 40px 80px -40px #000,0 0 70px -10px rgba(46,230,160,.5)}
.over-card.win .over-title{
  background:linear-gradient(96deg,#fff,#9dffd8 50%,#2ee6a0);
  -webkit-background-clip:text;background-clip:text}
.over-card.win .over-kicker{color:#6ce0b0}

/* ---------- 模式芯片 / 抽屉 ---------- */
.mode-chip{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;
  color:#ffe6b8;border-color:rgba(255,190,90,.5);
  background:linear-gradient(180deg,rgba(90,58,20,.6),rgba(30,16,10,.8))}
.mode-chip:hover{color:#fff;border-color:rgba(255,205,120,.9);
  box-shadow:0 0 0 1px rgba(255,190,90,.25),0 8px 20px -12px rgba(255,170,60,.9)}

.drawer{position:fixed;inset:0;z-index:120}
.drawer[hidden]{display:none}
.drawer-mask{position:absolute;inset:0;background:rgba(4,2,8,.6);backdrop-filter:blur(3px);
  animation:fadeIn .2s ease}
.drawer-panel{position:absolute;left:0;top:0;bottom:0;width:min(340px,86vw);padding:18px 16px;
  display:flex;flex-direction:column;gap:10px;overflow-y:auto;
  background:linear-gradient(180deg,rgba(34,16,34,.98),rgba(12,6,16,.99));
  border-right:1px solid rgba(255,150,195,.25);
  box-shadow:24px 0 60px -30px #000;
  animation:slideIn .28s cubic-bezier(.2,.9,.2,1)}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;letter-spacing:2px;color:#c9a9bd;padding:2px 2px 8px;
  border-bottom:1px solid rgba(255,150,195,.15)}
.drawer-x{font-style:normal;cursor:pointer;color:#ff9db4;font-size:14px;padding:2px 6px;border-radius:6px}
.drawer-x:hover{background:rgba(255,45,85,.16)}

.mode-card{display:flex;flex-direction:column;gap:5px;text-align:left;padding:13px 14px;
  border-radius:14px;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid rgba(255,150,195,.18)}
.mode-card b{font-size:14px;color:#fff;letter-spacing:.3px}
.mode-card em{font-style:normal;font-size:11px;line-height:1.55;color:#bda0b0}
.mode-card:hover{border-color:rgba(255,120,175,.6);transform:translateX(2px)}
.mode-card.sel{border-color:rgba(255,90,140,.8);background:linear-gradient(180deg,rgba(255,45,85,.18),rgba(255,45,85,.04));
  box-shadow:0 0 0 1px rgba(255,45,85,.2) inset}
.mode-card[disabled]{opacity:.45;cursor:not-allowed}
.drawer-foot{margin-top:auto;font-size:10.5px;color:#8f7484;line-height:1.6;padding-top:10px}

/* ---------- 持仓面板 ---------- */
.pos-list{flex:0 0 30%;min-height:82px;display:flex;flex-direction:column;gap:5px;
  overflow-y:auto;padding:8px;border-radius:16px;
  background:linear-gradient(180deg,rgba(32,16,32,.32),rgba(12,6,16,.48));
  border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.pos-list:empty::after{content:'暂无持仓';display:block;text-align:center;padding:14px 0;
  font-size:11px;color:#8f7484}
.pos{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 9px;
  border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,150,195,.1)}
.pos .n{font-size:11.5px;font-weight:600;color:#f2e2ec;line-height:1.35;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .n small{display:block;font-weight:400;font-size:9.5px;color:#a98a99;font-family:var(--mono)}
.pos .v{text-align:right;font-family:var(--mono);font-size:11px;white-space:nowrap}
.pos .x{cursor:pointer;color:#ff8fa8;font-size:11px;padding:0 3px;opacity:.75}
.pos .x:hover{opacity:1}

/* ---------- 结算评级 ---------- */
.over-rate{display:flex;align-items:center;gap:12px;margin:14px 0 2px;text-align:left}
.over-rate b{flex:0 0 auto;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;border-radius:14px;font-family:var(--mono);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,150,190,.25);color:#fff}
.over-rate.g-S b,.over-rate.g-A b{color:#ffd166;border-color:rgba(255,209,102,.6);
  background:rgba(255,209,102,.12);text-shadow:0 0 18px rgba(255,200,90,.8)}
.over-rate.g-D b,.over-rate.g-F b{color:#ff6b8c;border-color:rgba(255,80,120,.5);background:rgba(255,45,85,.12)}
.over-rate span{font-size:11.5px;line-height:1.65;color:#d9bccd}
/* ---------- 背景音乐按钮 ---------- */
.bgm{width:40px;padding:8px 0;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.bgm .eq{display:inline-flex;align-items:flex-end;gap:2.5px;height:14px}
.bgm .eq i{display:block;width:3px;height:5px;border-radius:2px;background:currentColor;
  opacity:.72;transition:height .18s}
.bgm .eq i:nth-child(2){height:10px}
.bgm .eq i:nth-child(3){height:7px}
.bgm.on{color:#fff;border-color:rgba(255,140,180,.75);
  background:linear-gradient(180deg,#ff5f8c,#db0f3d);
  box-shadow:0 10px 24px -12px rgba(255,45,85,.95),0 0 0 1px rgba(255,255,255,.16) inset}
.bgm.on .eq i{opacity:1;animation:eq .92s ease-in-out infinite}
.bgm.on .eq i:nth-child(2){animation-delay:.17s}
.bgm.on .eq i:nth-child(3){animation-delay:.34s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* ---------- 布局 ---------- */
.main{display:grid;grid-template-columns:282px minmax(0,1fr) 316px;gap:14px;flex:1;min-height:0;min-width:0;align-items:stretch}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}

.panel-title{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;letter-spacing:1.3px;color:#d6b3c8;padding:2px 2px 2px 9px;
  border-left:2px solid rgba(255,45,85,.75);text-shadow:0 0 14px rgba(255,45,85,.4)}
.panel-title small{font-size:10px;letter-spacing:.2px;color:#bda0b2;font-weight:400;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.col>.panel-title{background:linear-gradient(180deg,rgba(12,6,16,.46),rgba(12,6,16,.24));
  border:1px solid rgba(255,150,195,.16);border-left:2px solid rgba(255,45,85,.85);
  border-radius:11px;padding:8px 11px;backdrop-filter:blur(10px) saturate(1.2);
  -webkit-backdrop-filter:blur(10px) saturate(1.2);
  box-shadow:0 14px 30px -26px #000, 0 0 0 1px rgba(255,255,255,.03) inset}
#chart-name{color:#fff;letter-spacing:.6px;font-size:12.5px}

/* ---------- 行情列表 ---------- */
.list{flex:1 1 0;min-height:120px;min-width:0;display:flex;flex-direction:column;gap:6px;
  overflow-y:auto;padding:8px;border-radius:18px;
  background:linear-gradient(180deg,rgba(32,16,32,.32),rgba(12,6,16,.48));
  border:1px solid var(--line);backdrop-filter:blur(14px);
  box-shadow:var(--shadow);overscroll-behavior:contain}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;
  padding:9px 11px;border-radius:12px;cursor:pointer;border:1px solid transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  transition:transform .16s,border-color .16s,background .16s,box-shadow .2s}
.row:hover{border-color:rgba(255,120,175,.34);transform:translateX(2px)}
.row.sel{border-color:rgba(255,90,140,.68);
  background:linear-gradient(180deg,rgba(255,45,85,.20),rgba(255,45,85,.05));
  box-shadow:0 0 0 1px rgba(255,45,85,.22) inset,0 14px 30px -22px rgba(255,30,80,1)}
.r-name{font-size:13px;font-weight:700;line-height:1.3;letter-spacing:.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r-name small{display:block;font-weight:400;font-size:9.5px;color:var(--dim);
  font-family:var(--mono);margin-top:1px;letter-spacing:.6px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.r-hold{font-size:10px;color:#e0aec6;margin-top:4px;font-family:var(--mono);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.r-right{text-align:right;flex-shrink:0}
.r-price{font-size:14px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.r-chg{font-size:11px;font-family:var(--mono);margin-top:2px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.7)}

/* ---------- 图表 ---------- */
#chart{width:100%;max-width:100%;flex:1;min-height:300px;display:block;border-radius:18px;
  border:1px solid var(--line);
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(255,45,85,.12),transparent 62%),
    linear-gradient(180deg,rgba(26,12,26,.34),rgba(9,4,13,.56));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow),0 0 60px -30px rgba(255,45,85,.55)}

/* ---------- 交易面板 ---------- */
.trade{padding:13px;display:flex;flex-direction:column;gap:9px;border-radius:18px}
.ti-name{font-size:11px;letter-spacing:.8px;color:#dcbccf;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ti-price{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-1px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  text-shadow:0 0 30px rgba(255,45,85,.35)}
.ti-chg{font-size:11.5px;font-family:var(--mono);margin-top:-3px;display:inline-block;
  padding:2px 8px 2px 0;text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.6)}
.ti-hold{font-size:11.5px;line-height:1.65;color:#c3a4b6;padding:8px 10px;border-radius:10px;
  background:rgba(0,0,0,.16);border:1px solid rgba(255,150,195,.10)}
[hidden]{display:none!important}
.lev-row[hidden]{display:none}
.qty-row{display:flex;gap:8px}
.lev-row{display:flex;align-items:center;gap:6px;margin:2px 0 2px}
.lev-row>span{font-size:9.5px;letter-spacing:1.2px;color:var(--dim);white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.7)}
.lev{flex:1;padding:6px 0;font-size:11px;letter-spacing:.3px;border-radius:9px;font-family:var(--mono);
  color:#c9a9bd;background:rgba(255,255,255,.04);border:1px solid rgba(255,150,195,.22);
  transition:all .16s;cursor:pointer}
.lev:hover{color:#fff;border-color:rgba(255,150,195,.5)}
.lev.active{color:#160208;font-weight:800;border-color:#ffcf6b;
  background:linear-gradient(180deg,#ffe08a,#f0a92c);box-shadow:0 3px 12px rgba(240,169,44,.35)}
#qty{flex:1;width:100%;padding:10px 12px;border-radius:11px;color:#fff;font-family:var(--mono);
  font-size:16px;font-variant-numeric:tabular-nums;outline:none;
  background:rgba(0,0,0,.26);border:1px solid var(--line-2);transition:border-color .2s,box-shadow .2s}
#qty:focus{border-color:rgba(255,120,175,.78);box-shadow:0 0 0 3px rgba(255,45,85,.16)}
#qty::-webkit-outer-spin-button,#qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hint{font-size:10px;letter-spacing:.4px;color:var(--dim);text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}

/* ---------- 日志 ---------- */
.log-wrap{flex:1;display:flex;flex-direction:column;gap:8px;min-height:130px}
.log{flex:1;overflow-y:auto;padding:9px 11px;border-radius:16px;font-size:11.5px;
  display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(180deg,rgba(30,16,30,.36),rgba(10,5,14,.54));
  border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:var(--shadow);
  overscroll-behavior:contain}
.li{display:flex;gap:7px;line-height:1.55;color:#cfb6c8;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.li .d{flex-shrink:0;font-size:9.5px;padding-top:2px;color:#7d6474;font-family:var(--mono)}
.li.buy,.li.up{color:#ff9db4}
.li.sell,.li.down{color:#7df0c4}
.li.sys{color:#d9b8ff}

/* ---------- 颜色类 ---------- */
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(255,120,175,.26);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,120,175,.48)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 响应式 ---------- */
@media(max-width:1120px){
  .topbar{grid-template-columns:minmax(0,1fr);gap:12px;padding:13px 14px}
  .brand{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctrl{justify-content:flex-start}
  .main{grid-template-columns:minmax(0,1fr)}
  /* 移动端顺序：图表 → 交易 → 行情 → 日志 */
  .col.mid{order:0}
  .col.right{display:contents}
  .trade{order:1}
  .eq-panel{order:2}
  .col.left{order:3}
  .log-wrap{order:4}
  #chart{height:min(46vh,360px);min-height:240px;flex:none}
  .list{max-height:300px}
  .log{max-height:200px}
  .brand small{display:none}
}
@media(max-width:420px){
  .app{padding:12px 10px 24px}
  button{padding:7px 9px;font-size:12.5px}
  .ctrl{gap:6px;justify-content:center}
  .mode-btn{font-size:12px}
  .spd{padding:7px 10px}
  .ti-price{font-size:30px}
  .stats{gap:7px}
  .stat{min-width:0;padding:7px 10px}
  .stat b{font-size:14px}
}
</style>

<body>

<div class="bg" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<div id="danger" aria-hidden="true"></div>
<div class="app">

  <header class="topbar panel">
    <div class="brand">
      <b>久留美体验器</b>
      <small>SIMULATED MARKET · LOCAL ONLY</small>
      <div class="brand-row">
        <span class="badge"><i></i>纯模拟 · 不涉及真钱</span>
        <button id="mode" class="mode-chip" title="选择模式">📈 A股 ▾</button>
        <button id="sfx" class="icon-btn" title="音效开关" aria-label="音效">🔊</button>
        <button id="challenge" class="icon-btn" title="60 秒挑战" aria-label="挑战">⏱</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span id="lbl-day">交易日</span><b id="s-day">0</b></div>
      <div class="stat"><span id="lbl-eq">总资产</span><b id="s-equity">100,000.00</b></div>
      <div class="stat"><span id="lbl-cash">可用现金</span><b id="s-cash">100,000.00</b></div>
      <div class="stat"><span id="lbl-pnl">总盈亏</span><b id="s-pnl" class="flat">0.00</b></div>
    </div>

    <div class="ctrl">
      <button id="bgm" class="bgm" title="背景音乐" aria-label="背景音乐">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <input id="bgm-file" type="file" accept="audio/*,video/mp4,video/quicktime,.mp3,.m4a,.wav,.ogg,.flac,.aac,.mp4,.mov" hidden>
      <button class="spd" data-speed="0">⏸ 暂停</button>
      <button class="spd active" data-speed="1">1x</button>
      <button class="spd" data-speed="5">5x</button>
      <button class="spd" data-speed="20">20x</button>
      <button class="spd" data-speed="50">50x</button>
      <button class="spd" data-speed="100">100x</button>
      <button id="reset">↺ 重置</button>
    </div>
  </header>

  <div id="riskbar" class="riskbar" hidden><span class="warn">⚠</span><b id="risk-txt"></b></div>
  <div id="goalbar" class="goalbar" hidden><span id="goal-label">🎯 挑战</span><b id="goal-txt"></b></div>

  <div class="main">
    <div class="col left">
      <div class="panel-title">行情列表 <small>点击切换</small></div>
      <div id="list" class="list"></div>
      <div class="panel-title">持仓 <small id="pos-count">0 个</small></div>
      <div id="positions" class="pos-list"></div>
    </div>

    <div class="col mid">
      <div class="panel-title"><span id="chart-name">—</span><small id="chart-sub"></small></div>
      <canvas id="chart"></canvas>
    </div>

    <div class="col right">
      <div class="trade panel">
        <div class="panel-title">交易</div>
        <div class="ti-name" id="ti-name">—</div>
        <div class="ti-price" id="ti-price">—</div>
        <div class="ti-chg" id="ti-chg">—</div>
        <div class="ti-hold" id="ti-hold">当前无持仓</div>
        <div class="lev-row" id="lev-row" hidden>
          <span>杠杆</span>
          <button class="lev" data-lev="10">10x</button>
          <button class="lev" data-lev="20">20x</button>
          <button class="lev" data-lev="50">50x</button>
          <button class="lev active" data-lev="100">100x</button>
          <button class="lev" data-lev="200">200x</button>
          <button class="lev" data-lev="500">500x</button>
        </div>
        <div class="qty-row">
          <input id="qty" type="number" min="1" step="1" value="100" inputmode="numeric">
          <input id="limit" type="number" step="0.01" placeholder="限价(空=市价)" inputmode="decimal">
        </div>
        <div id="orders" class="orders"></div>
        <div class="qty-row">
          <button id="btn-buy">买入</button>
          <button id="btn-sell">卖出</button>
        </div>
        <div class="qty-row">
          <button id="btn-all-buy" class="ghost">全仓买入</button>
          <button id="btn-all-sell" class="ghost">全部卖出</button>
        </div>
        <div class="hint" id="hint">手续费 0.1%（买卖双边）</div>
      </div>

      <div class="eq-panel">
        <div class="panel-title">净值走势 <small id="eq-sub">—</small></div>
        <canvas id="eqchart"></canvas>
      </div>

      <div class="log-wrap">
        <div class="panel-title">日志</div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-mask" data-close></div>
  <aside class="drawer-panel">
    <div class="drawer-head"><span>选择模式</span><i class="drawer-x" data-close>✕</i></div>
    <button class="mode-card" data-mode="stock">
      <b>📈 A股</b>
      <em>T+1 · 100 股整手 · 佣金万三 + 印花税 · 只做多</em>
    </button>
    <button class="mode-card" data-mode="fx">
      <b>💱 外汇（杠杆可调）</b>
      <em>6 个货币对 · 做多/做空 · 10~500x 杠杆自选 · 点差、隔夜费、保证金爆仓</em>
    </button>
    <button class="mode-card" data-mode="debt">
      <b>💳 债务模式</b>
      <em>A股规则 + 50 万债务 · 每 30 个交易日还 2.5 万，逾期出局</em>
    </button>
    <button class="mode-card" data-bgm="1">
      <b>🎵 背景音乐</b>
      <em>默认是代码现场合成的原创曲（零版权风险）· 点这里可换成你本地的音频</em>
    </button>
    <div class="drawer-foot">切换模式会重置账户，当前进度不保留</div>
  </aside>
</div>

<div id="headline" class="headline" hidden></div>
<div id="flash" class="flash"></div>
<div id="toasts" class="toasts"></div>

<div id="gameover" class="overlay" hidden>
  <div class="over-card" id="over-card">
    <div class="over-kicker" id="over-kicker">GAME OVER</div>
    <div class="over-title" id="over-title">你出局了</div>
    <div class="over-sub" id="over-sub">净值跌破初始资金的 50%</div>
    <canvas id="overchart" class="over-chart"></canvas>
    <div class="over-grid" id="over-grid"></div>
    <div class="over-rate"><b id="over-grade">—</b><span id="over-diag"></span></div>
    <div class="over-anchor" id="over-anchor"></div>
    <div class="over-ach" id="over-ach"></div>
    <div class="over-trades" id="over-trades"></div>
    <div class="over-btns">
      <button id="export" class="ghost">导出 CSV</button>
      <button id="restart" class="over-btn">重新开始</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Music — 原创 BGM 合成引擎（Web Audio，零素材、零版权风险）
   风格：燃系电子进行曲（D 小调 / 132 BPM / 4 小节循环）
   ========================================================= */
(function () {
  'use strict';

  const BPM = 132;
  const BEAT = 60 / BPM;
  const BAR = BEAT * 4;
  const STEP = BEAT / 4;          // 十六分音符

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* i - VI - III - VII（Dm - Bb - F - C），最"史诗"的进行 */
  const PROG = [
    { bass: 38, pad: [50, 53, 57], arp: [62, 65, 69, 74] },   // Dm
    { bass: 34, pad: [46, 50, 53], arp: [58, 62, 65, 70] },   // Bb
    { bass: 41, pad: [53, 57, 60], arp: [65, 69, 72, 77] },   // F
    { bass: 36, pad: [48, 52, 55], arp: [60, 64, 67, 72] },   // C
  ];

  /* 主旋律：4 小节一句，D 小调五声 */
  const MELODY = [
    [0, 74, 2], [2, 77, 2], [4, 79, 2], [6, 77, 2],
    [8, 74, 2], [10, 72, 2], [12, 74, 4],
    [16, 77, 2], [18, 79, 2], [20, 81, 2], [22, 79, 2],
    [24, 77, 4], [28, 74, 4],
    [32, 72, 2], [34, 74, 2], [36, 77, 2], [38, 79, 2],
    [40, 81, 2], [42, 84, 2], [44, 81, 4],
    [48, 79, 2], [50, 77, 2], [52, 74, 2], [54, 72, 2],
    [56, 74, 8],
  ];

  let noiseBuf = null;
  function getNoise(ctx) {
    if (noiseBuf) return noiseBuf;
    const len = Math.floor(ctx.sampleRate * 0.5);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }

  /* ---- 音色 ---- */
  function kick(ctx, t, out) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
    env(g, t, 0.004, 0.9, 0.16);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.22);
  }

  function snare(ctx, t, out) {
    const src = ctx.createBufferSource(), g = ctx.createGain(), bp = ctx.createBiquadFilter();
    src.buffer = getNoise(ctx);
    bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.9;
    env(g, t, 0.003, 0.34, 0.11);
    src.connect(bp); bp.connect(g); g.connect(out);
    src.start(t); src.stop(t + 0.2);

    const o = ctx.createOscillator(), g2 = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = 190;
    env(g2, t, 0.003, 0.18, 0.08);
    o.connect(g2); g2.connect(out);
    o.start(t); o.stop(t + 0.14);
  }

  function hat(ctx, t, vol, out) {
    const src = ctx.createBufferSource(), g = ctx.createGain(), hp = ctx.createBiquadFilter();
    src.buffer = getNoise(ctx);
    hp.type = 'highpass'; hp.frequency.value = 7600;
    env(g, t, 0.002, vol, 0.035);
    src.connect(hp); hp.connect(g); g.connect(out);
    src.start(t); src.stop(t + 0.08);
  }

  function bass(ctx, t, midi, dur, out) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = mtof(midi);
    lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 6;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.30, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function arp(ctx, t, midi, out) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'square'; o.frequency.value = mtof(midi);
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    env(g, t, 0.004, 0.075, 0.085);
    o.connect(lp); lp.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.14);
  }

  function lead(ctx, t, midi, dur, out) {
    [0, 7].forEach((det, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = 'sawtooth';
      o.frequency.value = mtof(midi);
      o.detune.value = det;
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(3400, t);
      lp.frequency.exponentialRampToValueAtTime(1500, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(i ? 0.085 : 0.11, t + 0.02);
      g.gain.setValueAtTime(i ? 0.085 : 0.11, t + dur * 0.75);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(lp); lp.connect(g); g.connect(out);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }

  function pad(ctx, t, notes, dur, out) {
    notes.forEach((n) => {
      [-6, 6].forEach((det) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = mtof(n); o.detune.value = det;
        lp.type = 'lowpass'; lp.frequency.value = 1100;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.045, t + dur * 0.35);
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(lp); lp.connect(g); g.connect(out);
        o.start(t); o.stop(t + dur + 0.05);
      });
    });
  }

  /* 一小节 */
  function scheduleBar(ctx, t, bar, out) {
    const ch = PROG[bar % PROG.length];

    for (let b = 0; b < 4; b++) {
      kick(ctx, t + b * BEAT, out);
      if (b % 2 === 1) snare(ctx, t + b * BEAT, out);
      hat(ctx, t + b * BEAT + BEAT / 2, 0.05, out);
    }
    for (let s = 0; s < 16; s += 2) hat(ctx, t + s * STEP, 0.028, out);

    for (let e = 0; e < 8; e++) bass(ctx, t + e * BEAT / 2, ch.bass + (e % 2 ? 12 : 0), BEAT * 0.42, out);

    pad(ctx, t, ch.pad, BAR * 0.96, out);

    for (let s = 0; s < 16; s++) {
      const n = ch.arp[(s + (bar % 2 ? 1 : 0)) % ch.arp.length];
      arp(ctx, t + s * STEP, n, out);
    }
  }

  function scheduleMelody(ctx, t, loopStart, out) {
    for (const m of MELODY) {
      const abs = loopStart + m[0] * STEP;
      if (abs < t) continue;
      if (abs > t + BAR * 4) break;
      lead(ctx, abs, m[1], m[2] * STEP * 0.92, out);
    }
  }

  /* ---- 在线播放（循环） ---- */
  let ctx = null, master = null, timer = null, nextTime = 0, bar = 0, playing = false;

  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.55;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function tick() {
    if (!playing) return;
    while (nextTime < ctx.currentTime + 0.4) {
      scheduleBar(ctx, nextTime, bar % 8, master);
      if (bar % 4 === 0) scheduleMelody(ctx, nextTime, nextTime, master);
      nextTime += BAR;
      bar++;
    }
  }

  function start() {
    ensureCtx();
    if (playing) return;
    playing = true;
    nextTime = ctx.currentTime + 0.08;
    bar = 0;
    tick();
    timer = setInterval(tick, 90);
  }

  function stop() {
    playing = false;
    if (timer) { clearInterval(timer); timer = null; }
    if (master && ctx) {
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(0.0001, t + 0.25);
      setTimeout(() => {
        if (master) { master.gain.cancelScheduledValues(0); master.gain.value = 0.55; }
      }, 400);
    }
  }

  /* ---- 离线渲染（用于自检 / 导出） ---- */
  function render(seconds) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const sr = 44100;
    const oc = new OAC(2, Math.floor(sr * seconds), sr);
    const g = oc.createGain();
    g.gain.value = 0.55;
    const comp = oc.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    g.connect(comp); comp.connect(oc.destination);
    const bars = Math.ceil(seconds / BAR);
    for (let b = 0; b < bars; b++) {
      scheduleBar(oc, b * BAR, b % 8, g);
      if (b % 4 === 0) scheduleMelody(oc, b * BAR, b * BAR, g);
    }
    return oc.startRendering();
  }

  window.Music = { start: start, stop: stop, render: render, isPlaying: () => playing, BPM: BPM };
})();

<script>
/* =========================================================
   久留美体验器 · 游戏引擎（源代码，不是成品）
   这份文件由 _build_theme.py 内联进「久留美体验器_主题版.html」。
   直接双击 game.js 不会发生任何事——它是被 HTML 调用的脚本。

   三种模式：
   - A股   T+1、100 股整手、佣金万三(最低 5 元) + 印花税千五(卖) + 过户费，
           ±10% 涨跌停、只做多
   - 外汇  10~500 倍杠杆可调、点差、隔夜利息、可做多/做空、保证金不足爆仓
   - 债务  A股规则 + 50 万债务，每 30 个交易日还 2.5 万，还不上就出局
   价格模型：几何布朗运动 + 市场共同因子 + t 分布肥尾 + 跳空 + 新闻冲击
   ========================================================= */
(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  const INIT_CASH = 100000;
  const MAX_HIST = 500;
  const BASE_LEV = 100;          // FX_DEF.margin 是按 100 倍记的基准
  let   leverage = 100;          // 当前杠杆（可调，仅外汇生效）
  const LIQ_RATIO = 0.5;          // 净值跌破已用保证金的 50% 即强平
  const OUT_RATIO = 0.5;          // 净值跌破初始资金的 50% 即出局
  const MONTHLY   = 8000;         // 金额锚定用：月薪 8k

  /* A股规则 */
  const LOT        = 100;         // 一手 = 100 股
  const COMM       = 0.0003;      // 佣金 万三
  const COMM_MIN   = 5;           // 佣金最低 5 元
  const STAMP      = 0.0005;      // 印花税 千五（仅卖出）
  const TRANSFER   = 0.00001;     // 过户费 十万分之一（双边）

  /* ---------- 品种定义 ---------- */
  const STOCK_DEF = [
    { code: '600001', name: '葫芦娃酒业',   price: 128,  mu: 0.00055, sigma: 0.017, beta: 0.75 },
    { code: '600002', name: '银河芯片',     price: 46,   mu: 0.00075, sigma: 0.034, beta: 1.40 },
    { code: '600003', name: '工农银行',     price: 6.30, mu: 0.00010, sigma: 0.009, beta: 0.55 },
    { code: '600004', name: '追光新能源',   price: 88,   mu: 0.00050, sigma: 0.030, beta: 1.15 },
    { code: '600005', name: '长生医药',     price: 34,   mu: 0.00030, sigma: 0.022, beta: 0.90 },
    { code: '600006', name: '芝麻开门科技', price: 205,  mu: 0.00070, sigma: 0.038, beta: 1.50 },
  ].map(d => Object.assign(d, {
    cls: 'stock', dec: 2, minP: 0.5, fee: 0.001,
    mult: 1, margin: 0, spread: 0, newsP: 0.012, jumpP: 0.02
  }));

  const FX_DEF = [
    { code: 'USDJPY', name: '美元/日元',   price: 151.20, mu: 0.00003, sigma: 0.0052, beta: 0.45, dec: 3, mult: 661,   margin: 1000, spread: 0.012 },
    { code: 'EURUSD', name: '欧元/美元',   price: 1.0850, mu: 0.00002, sigma: 0.0048, beta: 0.60, dec: 5, mult: 100000, margin: 1100, spread: 0.00012 },
    { code: 'GBPUSD', name: '英镑/美元',   price: 1.2650, mu: 0.00002, sigma: 0.0055, beta: 0.70, dec: 5, mult: 100000, margin: 1290, spread: 0.00016 },
    { code: 'AUDUSD', name: '澳元/美元',   price: 0.6580, mu: 0.00001, sigma: 0.0060, beta: 0.80, dec: 5, mult: 100000, margin: 660,  spread: 0.00018 },
    { code: 'USDCNH', name: '美元/离岸人民币', price: 7.2400, mu: 0.00001, sigma: 0.0035, beta: 0.30, dec: 4, mult: 100000, margin: 1010, spread: 0.0020 },
    { code: 'XAUUSD', name: '黄金/美元',   price: 2050.0, mu: 0.00020, sigma: 0.0085, beta: -0.20, dec: 2, mult: 100,  margin: 2050, spread: 0.35 },
  ].map(d => Object.assign(d, {
    cls: 'fx', minP: 0.00001, fee: 0, newsP: 0.010, jumpP: 0.025, swap: 0.9   // 每手每天隔夜利息（美元）
  }));

  /* 模式：market 决定交易规则，debt 触发债务玩法 */
  const MODES = {
    stock: { name: 'A股', icon: '📈', market: 'stock' },
    fx:    { name: '外汇', icon: '💱', market: 'fx' },
    debt:  { name: '债务模式', icon: '💳', market: 'stock', debt: 500000, period: 30, installment: 25000 },
  };
  const isFx = () => MODES[mode].market === 'fx';

  const NEWS_GOOD = ['获得大额订单', '业绩超预期', '新产品发布成功', '获得政策补贴', '宣布股份回购', '被纳入重要指数'];
  const NEWS_BAD  = ['收到监管问询', '业绩不及预期', '核心高管离职', '产品被曝质量问题', '原材料成本大涨', '大股东减持'];
  const FX_NEWS_GOOD = ['非农数据大幅低于预期', '央行意外鸽派表态', '避险资金流入', '贸易谈判取得突破', '机构大幅上调目标价'];
  const FX_NEWS_BAD  = ['央行意外加息', '通胀数据爆表', '地缘局势升级', '主权评级遭下调', '大型机构集中抛售'];

  /* ---------- 工具 ---------- */
  function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  /* 学生 t 分布（df=3，归一化到单位方差）——比正态更容易出极端值 */
  function tdraw() {
    let c = 0;
    for (let i = 0; i < 3; i++) { const g = randn(); c += g * g; }
    return randn() / Math.sqrt(c / 3) / Math.sqrt(3);
  }
  const pick = a => a[(Math.random() * a.length) | 0];
  const fmt = n => (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sign = n => (n > 0 ? '+' : '');
  const cls = v => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
  const clampR = (r, lo, hi) => Math.max(lo, Math.min(hi, r));

  /* ---------- 状态 ---------- */
  let mode, insts, cash, day, pos, sel, logLines, speed, accT, lastT;
  let dead = false, peak = INIT_CASH, stats = { trades: 0, wins: 0, maxDD: 0, liq: 0 };
  let eqHist = [], trades = [], orders = [], orderId = 0;
  let achUnlocked = {}, maxTradePnl = 0, winStreak = 0, bestStreak = 0;
  let sawLimitDown = false, wonChallenge = false;
  let challenge = { active: false, endAt: 0, startEq: INIT_CASH };
  let debt = { on: false, left: 0, period: 30, installment: 50000, next: 30 };

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  const listEl = $('list'), logEl = $('log'), canvas = $('chart'), ctx = canvas.getContext('2d');
  const sDay = $('s-day'), sEquity = $('s-equity'), sCash = $('s-cash'), sPnl = $('s-pnl');
  const lDay = $('lbl-day'), lEq = $('lbl-eq'), lCash = $('lbl-cash'), lPnl = $('lbl-pnl');
  const tiName = $('ti-name'), tiPrice = $('ti-price'), tiChg = $('ti-chg'), tiHold = $('ti-hold');
  const chartName = $('chart-name'), chartSub = $('chart-sub');
  const qtyEl = $('qty'), hintEl = $('hint'), modeBtn = $('mode');
  const rowRefs = {};

  /* ---------- 初始化 ---------- */
  function init(nextMode) {
    mode = (nextMode && MODES[nextMode]) ? nextMode : (mode || 'stock');
    const defs = isFx() ? FX_DEF : STOCK_DEF;
    insts = defs.map(d => Object.assign({}, d, {
      hist: [{ o: d.price, h: d.price, l: d.price, c: d.price, v: 0 }], chg: 0, start: d.price
    }));
    pregen(120);

    cash = INIT_CASH;
    day = 0;
    pos = {};
    sel = insts[0].code;
    logLines = [];
    speed = 1;
    accT = 0;
    lastT = 0;
    dead = false;
    peak = INIT_CASH;
    stats = { trades: 0, wins: 0, maxDD: 0, liq: 0 };
    eqHist = []; trades = []; orders = []; orderId = 0;
    maxTradePnl = 0; winStreak = 0; bestStreak = 0;
    sawLimitDown = false; wonChallenge = false;
    challenge = { active: false, endAt: 0, startEq: INIT_CASH };
    const md = MODES[mode];
    debt = md.debt
      ? { on: true, left: md.debt, period: md.period, installment: md.installment, next: md.period }
      : { on: false, left: 0, period: 30, installment: 0, next: 0 };
    achUnlocked = loadAch();
    document.body.classList.remove('risk-1', 'risk-2', 'risk-3');
    $('riskbar').hidden = true;
    $('goalbar').hidden = true;
    $('gameover').hidden = true;
    $('challenge').classList.remove('on');
    $('orders').innerHTML = '';
    qtyEl.value = isFx() ? 1 : 100;

    document.querySelectorAll('.spd').forEach(b => b.classList.toggle('active', +b.dataset.speed === speed));

    applyMode();
    buildList();
    log(MODES[mode].name + ' · 初始' + (isFx() ? '净值' : '资金') + ' ' + fmt(INIT_CASH) +
      (isFx() ? ' · ' + leverage + ' 倍杠杆' : '') +
      (debt.on ? ' · 负债 ' + fmt(debt.left) : ''), 'sys');
    log(isFx()
      ? '提示：保证金不足 50% 会被强制平仓 · 点差与隔夜利息已计入'
      : '提示：T+1 交割，当日买入次日才能卖出；买入须为 100 股整数倍', 'sys');
  }

  /* 由开收盘价生成一根日 K */
  function makeBar(o, c, r) {
    const spread = Math.abs(r) + 0.004;
    const hi = Math.max(o, c) * (1 + Math.random() * spread * 0.7);
    const lo = Math.min(o, c) * (1 - Math.random() * spread * 0.7);
    const v = (0.4 + Math.random() * 0.9) * (1 + Math.abs(r) * 26);
    return { o: o, h: hi, l: lo, c: c, v: v };
  }

  /* 预热历史 */
  function pregen(n) {
    for (let i = 0; i < n; i++) {
      const m = randn() * 0.007 * (Math.random() < 0.02 ? 2.6 : 1);
      for (const s of insts) {
        let r = s.mu + s.sigma * tdraw() + s.beta * m;
        if (Math.random() < s.jumpP) {
          const amp = s.cls === 'fx' ? 0.004 + Math.random() * 0.012 : 0.02 + Math.random() * 0.05;
          r += (Math.random() < 0.5 ? -1 : 1) * amp;
        }
        if (s.cls === 'stock') r = clampR(r, -0.1, 0.1);
        const o = s.price;
        s.price = Math.max(s.minP, s.price * Math.exp(r));
        s.hist.push(makeBar(o, s.price, r));
      }
    }
    insts.forEach(s => { s.chg = 0; s.start = s.price; });
  }

  /* ---------- 一个交易日 ---------- */
  function tick() {
    day++;
    /* T+1：昨天买入的份额今天可卖 */
    for (const code in pos) if (pos[code].frozen) pos[code].frozen = 0;
    /* 大盘情绪：平时温和，偶尔来一次系统性冲击 */
    const market = randn() * 0.007 * (Math.random() < 0.02 ? 2.6 : 1);
    const newsList = [];

    for (const s of insts) {
      const prev = s.price;
      let r = s.mu + s.sigma * tdraw() + s.beta * market;

      /* 偶发跳空：一根大阴/大阳线 */
      if (Math.random() < s.jumpP) {
        const amp = s.cls === 'fx' ? 0.004 + Math.random() * 0.012 : 0.02 + Math.random() * 0.05;
        r += (Math.random() < 0.5 ? -1 : 1) * amp;
      }

      if (Math.random() < s.newsP) {
        const good = Math.random() < 0.5;
        const amp = s.cls === 'fx' ? 0.004 + Math.random() * 0.008 : 0.035 + Math.random() * 0.065;
        r += (good ? 1 : -1) * amp;
        newsList.push({ s, good, text: good ? pick(s.cls === 'fx' ? FX_NEWS_GOOD : NEWS_GOOD)
                                             : pick(s.cls === 'fx' ? FX_NEWS_BAD : NEWS_BAD) });
      }

      if (s.cls === 'stock') r = clampR(r, -0.1, 0.1);
      s.price = Math.max(s.minP, s.price * Math.exp(r));
      s.chg = s.price / prev - 1;
      s.hist.push(makeBar(prev, s.price, r));
      if (s.hist.length > MAX_HIST) s.hist.shift();
    }

    for (const n of newsList) {
      log('📰 ' + n.s.name + ' ' + n.text + (n.s.cls === 'fx' ? '，汇率异动' : '，股价异动'), n.good ? 'up' : 'down');
    }

    maybeBlackSwan();
    checkOrders();
    recordEquity();
    payDebt();

    if (isFx()) {
      carrySwap();
      checkLiquidation();
    }
  }

  /* 隔夜利息 */
  function carrySwap() {
    let lots = 0;
    for (const code in pos) lots += Math.abs(pos[code].qty);
    if (!lots) return;
    cash -= lots * 0.9;
  }

  /* 爆仓检查 */
  function checkLiquidation() {
    const m = usedMargin();
    if (m <= 0) return;
    const eq = equity();
    if (eq > m * LIQ_RATIO) return;
    let realized = 0;
    for (const code in pos) {
      const p = pos[code], s = byCode(code);
      realized += (s.price - p.avg) * s.mult * p.qty * p.dir;
    }
    cash = Math.max(0, cash + realized);
    pos = {};
    stats.liq++;
    stats.trades++;
    log('💥 保证金不足，全部持仓被强制平仓（净值 ' + fmt(cash) + '）', 'down');
    if (cash < INIT_CASH * OUT_RATIO) setTimeout(gameOver, 0, 'liq');
  }

  /* ---------- 计算 ---------- */
  const byCode = code => insts.find(x => x.code === code);
  const cur = () => byCode(sel);

  function equity() {
    let v = cash;
    for (const code in pos) {
      const p = pos[code], s = byCode(code);
      if (!p || !s) continue;
      if (isFx()) v += (s.price - p.avg) * s.mult * p.qty * p.dir;
      else v += s.price * p.qty;
    }
    return v;
  }

  /* 每手保证金 = 基准保证金 × 100 / 当前杠杆 */
  function marginOf(s) { return s.margin * BASE_LEV / leverage; }

  function usedMargin() {
    let v = 0;
    if (!isFx()) return 0;
    for (const code in pos) {
      const p = pos[code], s = byCode(code);
      if (p && s) v += Math.abs(p.qty) * marginOf(s);
    }
    return v;
  }

  function unrealized() {
    let v = 0;
    if (!isFx()) return 0;
    for (const code in pos) {
      const p = pos[code], s = byCode(code);
      if (p && s) v += (s.price - p.avg) * s.mult * p.qty * p.dir;
    }
    return v;
  }

  /* ---------- 渲染 ---------- */
  function render() {
    const eq = equity();
    sDay.textContent = day;

    /* 回撤 → 压迫感 */
    if (eq > peak) peak = eq;
    const dd = peak > 0 ? Math.max(0, (peak - eq) / peak) : 0;
    if (dd > stats.maxDD) stats.maxDD = dd;
    applyRisk(dd, eq);

    if (!dead) {
      if (debt.on) { if (eq <= 0) return gameOver('out'); }
      else if (eq <= INIT_CASH * OUT_RATIO) return gameOver('out');
    }

    drawEq();
    updateGoal();
    renderPositions();
    checkAch();

    if (isFx()) {
      const m = usedMargin(), pnl = unrealized();
      sEquity.textContent = fmt(eq);
      sCash.textContent = fmt(eq - m);
      sPnl.textContent = sign(pnl) + fmt(pnl);
      sPnl.className = cls(pnl);
      lEq.textContent = '净值';
      lCash.textContent = '可用保证金';
      lPnl.textContent = '浮动盈亏';
    } else {
      const pnl = eq - INIT_CASH;
      sEquity.textContent = fmt(eq);
      sCash.textContent = fmt(cash);
      sPnl.textContent = sign(pnl) + fmt(pnl) + ' (' + sign(pnl) + (pnl / INIT_CASH * 100).toFixed(2) + '%)';
      sPnl.className = cls(pnl);
      lEq.textContent = '总资产';
      lCash.textContent = '可用现金';
      lPnl.textContent = '总盈亏';
    }

    /* 行情列表 */
    for (const s of insts) {
      const r = rowRefs[s.code];
      if (!r) continue;
      r.price.textContent = s.price.toFixed(s.dec);
      r.chg.textContent = sign(s.chg) + (s.chg * 100).toFixed(2) + '%';
      r.chg.className = 'r-chg ' + cls(s.chg);
      const p = pos[s.code];
      r.hold.textContent = p
        ? (isFx()
            ? (p.dir > 0 ? '多 ' : '空 ') + Math.abs(p.qty) + ' 手'
            : '持 ' + p.qty + ' 股')
        : '';
      r.row.classList.toggle('sel', s.code === sel);
    }

    /* 交易面板 */
    const s = cur();
    const dir = cls(s.chg);
    tiName.textContent = s.name + '  ' + s.code;
    tiPrice.textContent = s.price.toFixed(s.dec);
    tiPrice.className = 'ti-price ' + dir;
    tiChg.textContent = '今日 ' + sign(s.chg) + (s.chg * 100).toFixed(2) + '%';
    tiChg.className = 'ti-chg ' + dir;

    const p = pos[sel];
    if (p) {
      if (isFx()) {
        const fl = (s.price - p.avg) * s.mult * p.qty * p.dir;
        tiHold.innerHTML = (p.dir > 0 ? '做多 ' : '做空 ') + Math.abs(p.qty) + ' 手 · 开仓 ' + p.avg.toFixed(s.dec) +
          '<br>浮动盈亏 <span class="' + cls(fl) + '">' + sign(fl) + fmt(fl) + '</span>';
      } else {
        const fl = (s.price - p.avg) * p.qty;
        const frozen = p.frozen || 0;
        tiHold.innerHTML = '持仓 ' + p.qty + ' 股 · 成本 ' + p.avg.toFixed(2) +
          (frozen ? ' · 可卖 ' + (p.qty - frozen) + '（今日买入 ' + frozen + ' 待解冻）' : '') +
          '<br>浮动盈亏 <span class="' + cls(fl) + '">' + sign(fl) + fmt(fl) + '</span>';
      }
    } else {
      tiHold.textContent = '当前无持仓';
    }

    chartName.textContent = s.name + ' ' + s.code;
    chartSub.textContent = '最新 ' + s.price.toFixed(s.dec) + ' · 近 ' + Math.min(s.hist.length, 120) + ' 个交易日';
  }

  /* ---------- 风险压迫 ---------- */
  function applyRisk(dd, eq) {
    const lv = dd >= 0.3 ? 3 : dd >= 0.2 ? 2 : dd >= 0.1 ? 1 : 0;
    const b = document.body.classList;
    b.toggle('risk-1', lv === 1);
    b.toggle('risk-2', lv === 2);
    b.toggle('risk-3', lv === 3);
    const bar = $('riskbar');
    if (!lv) { bar.hidden = true; return; }
    bar.hidden = false;
    const head = '回撤 ' + (dd * 100).toFixed(1) + '%（自最高点 ' + fmt(peak) + '）';
    const tail = debt.on
      ? ' · 距债务违约 ' + (debt.next - day) + ' 天'
      : ' · 距出局线还差 ' + fmt(Math.max(0, eq - INIT_CASH * OUT_RATIO)) + ' 元';
    $('risk-txt').textContent = head + tail + ' · 较最高点 -' + fmt(peak - eq) + ' 元';
  }

  function bestScore() {
    try { return +(localStorage.getItem('klm_best') || 0); } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { if (v > bestScore()) localStorage.setItem('klm_best', String(v)); } catch (e) {}
  }

  function gradeOf(ret, dd) {
    if (ret >= 0.5 && dd <= 0.3) return 'S';
    if (ret >= 0.2) return 'A';
    if (ret >= 0.05) return 'B';
    if (ret > -0.1) return 'C';
    if (ret > -0.3) return 'D';
    return 'F';
  }

  function diagnose(ret, dd, winRate, kind) {
    const n = stats.trades;
    const pct = (dd * 100).toFixed(1) + '%';
    if (kind === 'cleared') return '50 万债务按期还完，这不是运气，是仓位管理。';
    if (kind === 'debt') return '债务到期还不上，被强制清盘——现金流永远比收益率重要。';
    if (kind === 'win') return '60 秒做到 +20%，敢下手、也及时收手了。';
    if (n < 3) return '这局几乎没出手（' + n + ' 笔），钱是保住了，但也没给自己任何机会。';
    if (dd > 0.35) return '最大回撤 ' + pct + '：下跌里一直没减仓，这是最常见的爆亏路径。';
    if (winRate < 35 && n > 5) return '做了 ' + n + ' 笔、胜率只有 ' + winRate + '%，手太碎，手续费和滑点把利润磨光了。';
    if (maxTradePnl > 3000 && ret < 0) return '你抓到过一笔 +' + fmt(maxTradePnl) + ' 的盈利，但没守住，最后反而倒亏。';
    if (ret > 0.2) return '节奏很好：' + n + ' 笔、胜率 ' + winRate + '%，回撤压在 ' + pct + ' 内。';
    if (ret > 0) return '小赚离场，稳是稳，但仓位偏轻——行情来了也没吃到多少。';
    return '慢慢阴跌到出局，最消耗心态的一种死法：每一笔都不致命，合起来要命。';
  }

  function gameOver(kind) {
    dead = true;
    const eq = Math.max(0, equity());
    const ret = eq / INIT_CASH - 1;
    const winRate = stats.trades ? Math.round(stats.wins / stats.trades * 100) : 0;
    const prevBest = bestScore();
    saveBest(ret * 100);
    saveRecord({ t: Date.now(), mode: mode, ret: ret * 100, dd: stats.maxDD * 100, days: day });
    const recs = loadRecords();

    const isWin = kind === 'win' || kind === 'cleared';
    $('over-card').classList.toggle('win', isWin);
    $('over-kicker').textContent = isWin ? 'CLEARED' : 'GAME OVER';
    $('over-title').textContent = kind === 'cleared' ? '债务还清'
      : kind === 'win' ? '挑战成功'
      : kind === 'liq' ? '你被强制平仓了'
      : kind === 'timeout' ? '时间到'
      : kind === 'debt' ? '债务违约'
      : '你出局了';
    $('over-sub').textContent = kind === 'cleared' ? '50 万债务全部结清，你自由了'
      : kind === 'win' ? '60 秒内把净值做到 +20%，手感很热'
      : kind === 'debt' ? '到期债务无力偿还，账户被清盘'
      : kind === 'timeout' ? '60 秒结束，没能达成 +20% 的目标'
      : kind === 'liq' ? '保证金不足，仓位被市场强制清空'
      : debt.on ? '现金被到期的债务耗尽，账户归零'
      : '净值跌破初始资金的 ' + (OUT_RATIO * 100) + '%';

    const grade = gradeOf(ret, stats.maxDD);
    const rateEl = $('over-grade').parentNode;
    rateEl.className = 'over-rate g-' + grade;
    $('over-grade').textContent = grade;
    $('over-diag').textContent = diagnose(ret, stats.maxDD, winRate, kind);

    $('over-grid').innerHTML = [
      ['存活交易日', day + ' 天'],
      ['最终净值', fmt(eq)],
      ['收益率', (ret >= 0 ? '+' : '') + (ret * 100).toFixed(2) + '%'],
      ['最大回撤', '-' + (stats.maxDD * 100).toFixed(1) + '%'],
      ['交易笔数', stats.trades + ' 笔'],
      ['胜率', winRate + '%'],
    ].map(g => '<div><span>' + g[0] + '</span><b>' + g[1] + '</b></div>').join('');

    const months = Math.abs(eq - INIT_CASH) / MONTHLY;
    const bestRet = recs.length ? Math.max.apply(null, recs.map(function (r) { return r.ret; })) : 0;
    $('over-anchor').innerHTML =
      '这一局' + (ret >= 0 ? '赚了 ' : '亏掉了 ') + fmt(Math.abs(eq - INIT_CASH)) + ' 元' +
      ' ≈ <b>' + months.toFixed(1) + ' 个月工资</b>' +
      '<br><span style="color:#a98a99">历史 ' + recs.length + ' 局 · 最佳 ' +
      (bestRet >= 0 ? '+' : '') + bestRet.toFixed(2) + '%</span>';

    $('gameover').hidden = false;

    if (eqHist.length > 1) {
      $('overchart').style.display = 'block';
      drawSeries($('overchart'), eqHist.slice(-240), 72, { dot: true });
    } else {
      $('overchart').style.display = 'none';
    }

    const achs = ACH.filter(a => achUnlocked[a.id]).map(a => '<i>' + a.n + '</i>').join('');
    $('over-ach').innerHTML = achs || '<i style="opacity:.5">还没有解锁成就</i>';

    const last = trades.slice(-12).reverse();
    $('over-trades').innerHTML = last.map(t =>
      '<div><span>D' + t.day + ' ' + t.name + ' ' + t.side + ' ' + t.qty + '</span>' +
      '<span class="' + (t.pnl === undefined ? '' : t.pnl >= 0 ? 'up' : 'down') + '">' +
      (t.pnl === undefined ? fmt(t.price) : (t.pnl >= 0 ? '+' : '') + t.pnl.toFixed(0)) + '</span></div>'
    ).join('') || '<div style="color:#8f7488">本局没有平仓记录</div>';

    $('gameover').hidden = false;
    log('💀 ' + (isWin ? '挑战成功' : kind === 'liq' ? '强制平仓' : '出局') + '：净值 ' + fmt(eq) +
      '（' + (ret * 100).toFixed(2) + '%）', 'down');
    if (isWin) sfx('win'); else sfx('boom');
  }

  /* ---------- 列表 ---------- */
  function buildList() {
    listEl.innerHTML = '';
    for (const code in rowRefs) delete rowRefs[code];
    for (const s of insts) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div><div class="r-name">' + s.name + '<small>' + s.code + '</small></div><div class="r-hold"></div></div>' +
        '<div class="r-right"><div class="r-price">—</div><div class="r-chg">—</div></div>';
      row.addEventListener('click', () => { sel = s.code; });
      listEl.appendChild(row);
      rowRefs[s.code] = {
        row,
        price: row.querySelector('.r-price'),
        chg: row.querySelector('.r-chg'),
        hold: row.querySelector('.r-hold'),
      };
    }
  }

  /* ---------- 持仓面板 ---------- */
  function closeOne(code) {
    const p = pos[code];
    if (!p) return;
    sel = code;
    if (isFx()) {
      const s = byCode(code);
      const half = s.spread / 2;
      const px = p.dir > 0 ? s.price - half : s.price + half;
      const realized = (px - p.avg) * s.mult * Math.abs(p.qty) * p.dir;
      cash += realized;
      stats.trades++; if (realized > 0) stats.wins++;
      log('平仓 ' + s.name + ' ' + Math.abs(p.qty) + ' 手，' + (realized >= 0 ? '盈利 ' : '亏损 ') + fmt(Math.abs(realized)), realized >= 0 ? 'sell' : 'buy');
      recordTrade({ day: day, name: s.name, side: '平仓', qty: Math.abs(p.qty), price: px, pnl: realized });
      delete pos[code];
      sfx(realized >= 0 ? 'sell' : 'lose');
      floatText((realized >= 0 ? '+' : '-') + fmt(Math.abs(realized)), realized >= 0 ? '#7df0c4' : '#ff9db4');
    } else {
      const avail = p.qty - (p.frozen || 0);
      if (avail <= 0) { log('T+1 限制：今日买入的 ' + p.qty + ' 股明日才能卖出', 'sys'); return; }
      sell(avail);
    }
  }

  function renderPositions() {
    const el = $('positions');
    const codes = Object.keys(pos);
    $('pos-count').textContent = codes.length + ' 个';
    if (!codes.length) { el.innerHTML = ''; return; }
    el.innerHTML = codes.map(code => {
      const p = pos[code], s = byCode(code);
      if (!p || !s) return '';
      let pnl, label;
      if (isFx()) {
        pnl = (s.price - p.avg) * s.mult * Math.abs(p.qty) * p.dir;
        label = (p.dir > 0 ? '多 ' : '空 ') + Math.abs(p.qty) + ' 手';
      } else {
        pnl = (s.price - p.avg) * p.qty;
        label = p.qty + ' 股' + (p.frozen ? '（冻 ' + p.frozen + '）' : '');
      }
      return '<div class="pos"><div class="n">' + s.name + '<small>' + label + '</small></div>' +
        '<div class="v ' + cls(pnl) + '">' + sign(pnl) + fmt(pnl) + '</div>' +
        '<span class="x" data-c="' + code + '">平</span></div>';
    }).join('');
    el.querySelectorAll('.x').forEach(x => {
      x.addEventListener('click', ev => closeOne(ev.target.dataset.c));
    });
  }

  /* ---------- 图表（蜡烛 + 成交量） ---------- */
  function drawChart() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const s = cur();
    const data = s.hist.slice(-90);
    if (data.length < 2) return;

    const padL = 10, padR = 62, padT = 14, padB = 18;
    const cw0 = W - padL - padR;
    const volH = Math.round((H - padT - padB) * 0.2);
    const chh = H - padT - padB - volH - 10;

    let mn = Infinity, mx = -Infinity, vmax = 0;
    for (const b of data) {
      if (b.l < mn) mn = b.l;
      if (b.h > mx) mx = b.h;
      if (b.v > vmax) vmax = b.v;
    }
    const p = pos[sel];
    if (p) { mn = Math.min(mn, p.avg); mx = Math.max(mx, p.avg); }
    const pad = (mx - mn) * 0.08 || 1;
    mn -= pad; mx += pad;
    if (vmax <= 0) vmax = 1;

    const step = cw0 / data.length;
    const bw = Math.max(1.5, step * 0.62);
    const X = i => padL + step * (i + 0.5);
    const Y = v => padT + chh * (1 - (v - mn) / (mx - mn));

    ctx.font = '10px ui-monospace, Menlo, monospace';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const y = padT + chh * i / 4;
      ctx.strokeStyle = 'rgba(255,140,180,.10)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw0, y); ctx.stroke();
      ctx.fillStyle = 'rgba(255,214,229,.55)';
      ctx.textAlign = 'left';
      ctx.fillText((mx - (mx - mn) * i / 4).toFixed(s.dec), padL + cw0 + 8, y);
    }

    const volY = padT + chh + 10;

    /* 成交量 */
    for (let i = 0; i < data.length; i++) {
      const b = data[i];
      const vh = Math.max(1, (b.v / vmax) * volH);
      ctx.fillStyle = b.c >= b.o ? 'rgba(255,51,88,.42)' : 'rgba(46,230,160,.38)';
      ctx.fillRect(X(i) - bw / 2, volY + volH - vh, bw, vh);
    }

    /* 蜡烛 */
    for (let i = 0; i < data.length; i++) {
      const b = data[i];
      const up = b.c >= b.o;
      const col = up ? '#ff3358' : '#2ee6a0';
      const x = X(i);
      const yo = Y(b.o), yc = Y(b.c);
      const top = Math.min(yo, yc);
      const hgt = Math.max(1.4, Math.abs(yc - yo));

      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, Y(b.h));
      ctx.lineTo(x, Y(b.l));
      ctx.stroke();

      ctx.fillStyle = col;
      ctx.fillRect(x - bw / 2, top, bw, hgt);
    }

    /* 开仓价虚线 */
    if (p) {
      const cy = Y(p.avg);
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, cy); ctx.lineTo(padL + cw0, cy); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#ffd166';
      ctx.textAlign = 'right';
      ctx.fillText('开仓价', padL + cw0 - 6, cy - 8);
    }

    /* 最新价标签 */
    const last = data[data.length - 1];
    const ly = Y(last.c);
    const up = last.c >= last.o;
    const col = up ? '#ff3358' : '#2ee6a0';
    ctx.save();
    ctx.setLineDash([2, 3]);
    ctx.strokeStyle = up ? 'rgba(255,51,88,.45)' : 'rgba(46,230,160,.4)';
    ctx.beginPath(); ctx.moveTo(padL, ly); ctx.lineTo(padL + cw0, ly); ctx.stroke();
    ctx.restore();

    ctx.fillStyle = col;
    ctx.beginPath();
    const tagW = 56, tagH = 15;
    ctx.roundRect ? ctx.roundRect(padL + cw0 + 2, ly - tagH / 2, tagW, tagH, 4) : ctx.rect(padL + cw0 + 2, ly - tagH / 2, tagW, tagH);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(last.c.toFixed(s.dec), padL + cw0 + 2 + tagW / 2, ly);
  }

  /* ---------- 交易：A股 ---------- */
  function stockFee(gross, isSell) {
    const comm = Math.max(gross * COMM, COMM_MIN);
    const stamp = isSell ? gross * STAMP : 0;
    const transfer = gross * TRANSFER;
    return { comm: comm, stamp: stamp, transfer: transfer, total: comm + stamp + transfer };
  }

  function buy(qty, atPrice) {
    const s = cur();
    qty = Math.floor(qty);
    if (!(qty > 0)) return log('请输入有效的买入数量', 'sys');
    if (qty % LOT !== 0) {
      qty = Math.floor(qty / LOT) * LOT;
      if (qty < LOT) return log('A股买入必须是 ' + LOT + ' 股的整数倍', 'sys');
      log('已按整手调整为 ' + qty + ' 股', 'sys');
    }
    /* 滑点：真实成交价比看到的略差（限价单按挂单价成交） */
    const fill = atPrice || s.price * (1 + 0.0005 + Math.random() * 0.002);
    const gross = fill * qty;
    const fee = stockFee(gross, false);
    const cost = gross + fee.total;
    if (cost > cash + 1e-6) {
      return log('现金不足：需要 ' + fmt(cost) + '（含费用 ' + fmt(fee.total) + '），可用 ' + fmt(cash), 'sys');
    }
    const old = pos[s.code] || { qty: 0, avg: 0, frozen: 0 };
    cash -= cost;
    pos[s.code] = {
      qty: old.qty + qty,
      avg: (old.qty * old.avg + cost) / (old.qty + qty),
      frozen: (old.frozen || 0) + qty
    };
    log('买入 ' + s.name + ' ' + qty + ' 股 @ ' + fill.toFixed(2) + '（报价 ' + s.price.toFixed(2) + '，滑点）' + '，成交 ' + fmt(gross) +
      '（佣金 ' + fmt(fee.comm) + (fee.stamp ? ' · 印花税 ' + fmt(fee.stamp) : '') +
      ' · 过户费 ' + fmt(fee.transfer) + '）', 'buy');
    log('T+1：本次买入的 ' + qty + ' 股明天才能卖出', 'sys');
    sfx('buy');
    floatText('-' + fmt(cost), '#ff9db4');
    recordTrade({ day: day, name: s.name, side: '买入', qty: qty, price: fill });
  }

  function sell(qty, atPrice) {
    const s = cur();
    qty = Math.floor(qty);
    if (!(qty > 0)) return log('请输入有效的卖出数量', 'sys');
    const p = pos[s.code];
    const held = p ? p.qty : 0;
    const frozen = p ? (p.frozen || 0) : 0;
    const available = held - frozen;
    if (qty > held) return log('持仓不足：仅有 ' + held + ' 股', 'sys');
    if (qty > available) {
      return log('T+1 限制：可卖 ' + available + ' 股（另有 ' + frozen + ' 股今日买入，明日解冻）', 'sys');
    }
    const fill = atPrice || s.price * (1 - 0.0005 - Math.random() * 0.002);
    const gross = fill * qty;
    const fee = stockFee(gross, true);
    const net = gross - fee.total;
    cash += net;
    const realized = net - p.avg * qty;
    p.qty -= qty;
    stats.trades++; if (realized > 0) stats.wins++;
    if (p.qty === 0) delete pos[s.code];
    log('卖出 ' + s.name + ' ' + qty + ' 股 @ ' + fill.toFixed(2) + '（报价 ' + s.price.toFixed(2) + '，滑点）' + '，到账 ' + fmt(net) +
      '（佣金 ' + fmt(fee.comm) + ' · 印花税 ' + fmt(fee.stamp) + ' · 过户费 ' + fmt(fee.transfer) + '）' +
      '，' + (realized >= 0 ? '盈利' : '亏损') + ' ' + fmt(Math.abs(realized)), 'sell');
    sfx(realized >= 0 ? 'sell' : 'lose');
    floatText((realized >= 0 ? '+' : '-') + fmt(Math.abs(realized)), realized >= 0 ? '#7df0c4' : '#ff9db4');
    recordTrade({ day: day, name: s.name, side: '卖出', qty: qty, price: fill, pnl: realized });
  }

  function allBuy() {
    const s = cur();
    let qty = Math.floor(cash / (s.price * (1 + COMM + TRANSFER)) / LOT) * LOT;
    while (qty >= LOT) {
      const gross = s.price * qty;
      if (gross + stockFee(gross, false).total <= cash + 1e-6) break;
      qty -= LOT;
    }
    if (qty < LOT) return log('现金不足以买入 1 手（' + LOT + ' 股）', 'sys');
    buy(qty);
  }

  function allSell() {
    const s = cur();
    const p = pos[s.code];
    if (!p || p.qty <= 0) return log('当前股票没有持仓', 'sys');
    const available = p.qty - (p.frozen || 0);
    if (available <= 0) return log('T+1 限制：今日买入的 ' + p.qty + ' 股明日才能卖出', 'sys');
    sell(available);
  }

  /* ---------- 交易：外汇 ---------- */
  function openFx(dir, lots, atPrice) {
    const s = cur();
    lots = Math.floor(lots);
    if (!(lots > 0)) return log('请输入有效手数', 'sys');

    const m = usedMargin();
    const free = equity() - m;
    const need = lots * marginOf(s);
    if (need > free + 1e-6) {
      return log('保证金不足：需要 ' + fmt(need) + '，可用 ' + fmt(free), 'sys');
    }

    const p = pos[s.code];
    const half = s.spread / 2;
    const px = atPrice || (s.price + (dir > 0 ? half : -half));   // 点差：买在卖出价，卖在买入价

    if (p && p.dir === dir) {
      const avg = (p.avg * Math.abs(p.qty) + px * lots) / (Math.abs(p.qty) + lots);
      p.qty = Math.abs(p.qty) + lots;
      p.avg = avg;
    } else if (p && p.dir !== dir) {
      if (lots >= Math.abs(p.qty)) {
        const realized = (px - p.avg) * s.mult * Math.abs(p.qty) * p.dir;
        cash += realized;
        stats.trades++; if (realized > 0) stats.wins++;
        log('平仓 ' + s.name + ' ' + Math.abs(p.qty) + ' 手，' + (realized >= 0 ? '盈利' : '亏损') + ' ' + fmt(Math.abs(realized)), realized >= 0 ? 'sell' : 'buy');
        delete pos[s.code];
        const rest = lots - Math.abs(p.qty);
        if (rest > 0) pos[s.code] = { qty: rest, avg: px, dir: dir };
      } else {
        const realized = (px - p.avg) * s.mult * lots * p.dir;
        cash += realized;
        stats.trades++; if (realized > 0) stats.wins++;
        p.qty = Math.abs(p.qty) - lots;
        log('部分平仓 ' + s.name + ' ' + lots + ' 手，' + (realized >= 0 ? '盈利' : '亏损') + ' ' + fmt(Math.abs(realized)), realized >= 0 ? 'sell' : 'buy');
      }
    } else {
      pos[s.code] = { qty: lots, avg: px, dir };
    }

    log((dir > 0 ? '做多 ' : '做空 ') + s.name + ' ' + lots + ' 手 @ ' + px.toFixed(s.dec) +
      ' · 占用保证金 ' + fmt(need), dir > 0 ? 'buy' : 'sell');
    sfx('buy');
    floatText((dir > 0 ? '+多 ' : '-空 ') + lots + ' 手', dir > 0 ? '#ff9db4' : '#7df0c4');
    recordTrade({ day: day, name: s.name, side: dir > 0 ? '做多' : '做空', qty: lots, price: px });
  }

  function closeAll() {
    let realized = 0, n = 0;
    for (const code in pos) {
      const p = pos[code], s = byCode(code);
      const half = s.spread / 2;
      const px = p.dir > 0 ? s.price - half : s.price + half;
      const one = (px - p.avg) * s.mult * Math.abs(p.qty) * p.dir;
      realized += one;
      n += Math.abs(p.qty);
      stats.trades++; if (one > 0) stats.wins++;
    }
    if (!n) return log('当前没有持仓', 'sys');

  function loop(now) {

    if (speed > 0 && !dead) {
      accT += dt * speed / 1000;
      let guard = 0;
      while (accT >= 1 && guard < 300) {

     扩展：音效 / 飘字 / 头条 / 快捷键 / 权益曲线 / 挂单

  /* ---------- 音效（WebAudio 现场合成，无素材） ---------- */
  let audioCtx = null, sfxOn = true;

  function sfxInit() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol, delay) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.value = vol || 0.18;
    src.connect(g); g.connect(audioCtx.destination);
    src.start(audioCtx.currentTime + (delay || 0));
  }

  function sfx(kind) {
    if (!sfxOn) return;
    sfxInit();
    if (!audioCtx) return;
    switch (kind) {
      case 'click': tone(880, 0.05, 'square', 0.03); break;
      case 'buy':   tone(620, 0.09, 'triangle', 0.10); tone(930, 0.11, 'triangle', 0.09, null, 0.07); break;
      case 'sell':  tone(880, 0.09, 'triangle', 0.10); tone(560, 0.12, 'triangle', 0.09, null, 0.07); break;
      case 'win':   tone(523, 0.1, 'sine', 0.1); tone(659, 0.1, 'sine', 0.1, null, 0.09); tone(784, 0.18, 'sine', 0.1, null, 0.18); break;
      case 'lose':  tone(240, 0.22, 'sawtooth', 0.07, 120); break;
      case 'boom':  noise(0.5, 0.22); tone(70, 0.55, 'sine', 0.16, 32); break;
      case 'heart': tone(58, 0.12, 'sine', 0.14); tone(52, 0.14, 'sine', 0.10, null, 0.16); break;
      case 'coin':  tone(1200, 0.06, 'square', 0.05); tone(1600, 0.08, 'square', 0.045, null, 0.05); break;
    }
  }

  /* ---------- 权益曲线 ---------- */
  function recordEquity() {
    eqHist.push(equity());
    if (eqHist.length > 800) eqHist.shift();
  }

  function drawSeries(cv, data, height, opts) {
    if (!cv) return;
    const W = cv.clientWidth, H = height || cv.clientHeight;
    if (!W || !H) return;
    const dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    if (!data.length) return;

    let mn = Math.min.apply(null, data), mx = Math.max.apply(null, data);
    mx = Math.max(mx, INIT_CASH); mn = Math.min(mn, INIT_CASH);
    const pad = (mx - mn) * 0.12 || 100;
    mn -= pad; mx += pad;
    const X = i => 2 + (W - 4) * i / Math.max(1, data.length - 1);
    const Y = v => H - 2 - (H - 4) * (v - mn) / (mx - mn);

    /* 初始资金基准线 */
    c.strokeStyle = 'rgba(255,209,102,.28)';
    c.setLineDash([3, 3]);
    c.beginPath(); c.moveTo(0, Y(INIT_CASH)); c.lineTo(W, Y(INIT_CASH)); c.stroke();
    c.setLineDash([]);

    const up = data[data.length - 1] >= INIT_CASH;
    const col = up ? '#ff3358' : '#2ee6a0';
    const grad = c.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, up ? 'rgba(255,51,88,.28)' : 'rgba(46,230,160,.24)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    c.beginPath();
    c.moveTo(X(0), Y(data[0]));
    for (let i = 1; i < data.length; i++) c.lineTo(X(i), Y(data[i]));
    c.lineTo(X(data.length - 1), H); c.lineTo(X(0), H); c.closePath();
    c.fillStyle = grad; c.fill();

    c.beginPath();
    c.moveTo(X(0), Y(data[0]));
    for (let i = 1; i < data.length; i++) c.lineTo(X(i), Y(data[i]));
    c.strokeStyle = col; c.lineWidth = 1.6; c.lineJoin = 'round'; c.stroke();

    if (opts && opts.dot) {
      c.beginPath(); c.arc(X(data.length - 1), Y(data[data.length - 1]), 2.6, 0, Math.PI * 2);
      c.fillStyle = col; c.fill();
    }
  }

  function drawEq() {
    drawSeries($('eqchart'), eqHist.slice(-240), 76, { dot: true });
    const r = equity() / INIT_CASH - 1;
    const sub = $('eq-sub');
    if (sub) {
      sub.textContent = (r >= 0 ? '+' : '') + (r * 100).toFixed(2) + '%';
      sub.style.color = r > 0 ? '#ff9db4' : r < 0 ? '#7df0c4' : '#a98a9b';
