  }

  /* ---------- 挂单 ---------- */
  function renderOrders() {
    const el = $('orders');
    if (!orders.length) { el.innerHTML = ''; return; }
    el.innerHTML = orders.map(o =>
      '<div class="o"><span>' + (o.side === 'buy' ? '买' : '卖') + ' ' + o.name + '</span>' +
      '<span><b>' + o.qty + '</b> @ <b>' + o.limit.toFixed(o.dec) + '</b></span>' +
      '<span class="x" data-id="' + o.id + '">✕</span></div>').join('');
    el.querySelectorAll('.x').forEach(x => {
      x.addEventListener('click', ev => {
        const id = +ev.target.dataset.id;
        orders = orders.filter(o => o.id !== id);
        renderOrders();
      });
    });
  }

  function placeOrder(side, qty, limit) {
    const s = cur();
    const p = pos[s.code];
    if (side === 'sell') {
      const avail = isFx() ? (p ? p.qty : 0) : (p ? p.qty - (p.frozen || 0) : 0);
      if (!avail) { log('没有可卖持仓，无法挂单', 'sys'); return; }
      if (qty > avail) { log('挂单数量超过可卖 ' + avail, 'sys'); return; }
    }
    orders.push({ id: ++orderId, code: s.code, name: s.name, side: side, qty: qty, limit: limit, dec: s.dec });
    if (orders.length > 4) orders.shift();
    renderOrders();
    sfx('click');
    log('挂单：' + (side === 'buy' ? '买入' : '卖出') + ' ' + s.name + ' ' + qty +
      (isFx() ? ' 手' : ' 股') + ' @ 限价 ' + limit.toFixed(s.dec), 'sys');
    $('limit').value = '';
  }

  function checkOrders() {
    if (!orders.length) return;
    const keep = [];
    for (const o of orders) {
      const s = byCode(o.code);
      if (!s) continue;
      const hit = o.side === 'buy' ? s.price <= o.limit : s.price >= o.limit;
      if (!hit) { keep.push(o); continue; }
      sel = o.code;
      if (isFx()) openFx(o.side === 'buy' ? 1 : -1, o.qty, o.limit);
      else if (o.side === 'buy') buy(o.qty, o.limit);
      else sell(o.qty, o.limit);
      log('✅ 限价单成交：' + o.name + ' ' + (o.side === 'buy' ? '买入' : '卖出') + ' @ ' + o.limit.toFixed(o.dec), 'sys');
      sfx('coin');
    }
    orders = keep;
    renderOrders();
  }

  /* ---------- 挑战模式 ---------- */
  const CHALLENGE_MS = 60000;
  const CHALLENGE_TARGET = 0.2;

  function startChallenge() {
    if (challenge.active) { log('挑战进行中', 'sys'); return; }
    challenge.active = true;
    challenge.endAt = performance.now() + CHALLENGE_MS;
    challenge.startEq = equity();
    $('challenge').classList.add('on');
    log('🎯 挑战开始：60 秒内净值 +20%', 'sys');
    sfx('coin');
    headline('🎯 挑战开始 · 60 秒内把 10 万做到 12 万', true);
  }

  function payDebt() {
    if (!debt.on || day < debt.next) return;
    debt.next += debt.period;
    if (cash < debt.installment) {
      log('💳 到期债务 ' + fmt(debt.installment) + ' 无力偿还，被强制清盘', 'down');
      gameOver('debt');
      return;
    }
    cash -= debt.installment;
    debt.left = Math.max(0, debt.left - debt.installment);
    log('💳 按期还款 ' + fmt(debt.installment) + '，剩余债务 ' + fmt(debt.left), 'sys');
    toast('💳 已还 ' + fmt(debt.installment) + ' · 余 ' + fmt(debt.left));
    sfx('coin');
    if (debt.left <= 0) {
      log('🎉 债务还清，你自由了', 'up');
      gameOver('cleared');
    }
  }

  function updateGoal() {
    const bar = $('goalbar');
    if (challenge.active) { bar.hidden = false; $('goal-label').textContent = '🎯 挑战'; updateChallenge(); return; }
    if (debt.on && !dead) {
      bar.hidden = false;
      $('goal-label').textContent = '💳 债务';
      const left = debt.next - day;
      $('goal-txt').textContent = '剩余债务 ' + fmt(debt.left) + ' · ' + left + ' 天后需还 ' + fmt(debt.installment);
      return;
    }
    bar.hidden = true;
  }

  function updateChallenge() {
    if (!challenge.active) return;
    const left = Math.max(0, challenge.endAt - performance.now());
    const eq = equity();
    const prog = eq / challenge.startEq - 1;
    $('goal-txt').textContent = '剩余 ' + (left / 1000).toFixed(1) + 's · 进度 ' +
      (prog >= 0 ? '+' : '') + (prog * 100).toFixed(2) + '% / +' + (CHALLENGE_TARGET * 100) + '%';
    if (prog >= CHALLENGE_TARGET) { challenge.active = false; $('challenge').classList.remove('on'); wonChallenge = true; gameOver('win'); return; }
    if (left <= 0) { challenge.active = false; $('challenge').classList.remove('on'); gameOver('timeout'); }
  }

  /* ---------- 黑天鹅 ---------- */
  function maybeBlackSwan() {
    if (Math.random() > 0.0025) return;
    const fx = isFx();
    const kind = fx
      ? (Math.random() < 0.55 ? 'cb' : 'cb2')
      : (Math.random() < 0.45 ? 'crash' : Math.random() < 0.65 ? 'limitdown' : 'rally');
    let pct = 0, msg = '', good = false;

    if (kind === 'crash') { pct = -0.07; msg = '🚨 触发熔断！沪深两市全线暴跌 7%'; }
    else if (kind === 'limitdown') { pct = -0.095; msg = '💀 千股跌停！恐慌盘涌出'; sawLimitDown = true; }
    else if (kind === 'rally') { pct = 0.07; msg = '🚀 政策利好，两市集体涨停潮'; good = true; }
    else if (kind === 'cb') { pct = 0.018; msg = '🏛 央行意外干预汇市，非美货币集体跳涨'; good = true; }
    else { pct = -0.018; msg = '🏛 央行意外加息，非美货币集体跳水'; }

    for (const s of insts) {
      const jitter = (Math.random() - 0.5) * 0.012;
      s.price = Math.max(s.minP, s.price * (1 + pct + jitter));
      const b = s.hist[s.hist.length - 1];
      if (b) {
        b.c = s.price;
        b.h = Math.max(b.h, b.c);
        b.l = Math.min(b.l, b.c);
        b.v *= 2.4;
      }
    }
    headline(msg, good);
    log(msg, good ? 'up' : 'down');
    flashScreen();
    sfx('boom');
    if (!good) sfx('lose');
  }

  /* ---------- 键盘 ---------- */
  function bindKeys() {
    window.addEventListener('keydown', e => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      const k = e.key.toLowerCase();
      if (k === 'escape') { closeDrawer(); return; }
      if (k === 'b') { e.preventDefault(); triggerBuy(); }
      else if (k === 's') { e.preventDefault(); triggerSell(); }
      else if (k === ' ') { e.preventDefault(); togglePause(); }
      else if (k === 'a') { e.preventDefault(); if (isFx()) closeAll(); else allBuy(); }
      else if (/^[1-6]$/.test(k)) {
        const idx = +k - 1;
        if (insts[idx]) { sel = insts[idx].code; sfx('click'); }
      }
    });
  }

  function togglePause() {
    const btn = document.querySelector('.spd[data-speed="0"]');

    sfx('click');

  function triggerBuy() {
    const lim = parseFloat($('limit').value);
    const qty = Math.floor(+qtyEl.value);
    if (lim > 0) { placeOrder('buy', Math.max(1, qty), lim); return; }
    if (isFx()) openFx(1, qty); else buy(qty);
  }
  function triggerSell() {
    const lim = parseFloat($('limit').value);
    const qty = Math.floor(+qtyEl.value);
    if (lim > 0) { placeOrder('sell', Math.max(1, qty), lim); return; }
    if (isFx()) openFx(-1, qty); else sell(qty);
  }

  document.querySelectorAll('.lev').forEach(b => {
    b.addEventListener('click', () => {
      const v = +b.dataset.lev;
      if (!(v > 0) || v === leverage) return;
      leverage = v;

      log('杠杆调整为 ' + v + ' 倍 · ' + s.name + ' 每手保证金 ' + fmt(marginOf(s)), 'sys');
      hintEl.textContent = leverage + ' 倍杠杆 · 点差已计入 · 净值跌破保证金 50% 即爆仓';
      if (isFx()) {
        const m = usedMargin(), eq = equity();
        if (m > 0 && eq <= m * LIQ_RATIO) log('⚠ 新杠杆下净值已低于爆仓线，下一跳就会被强制平仓', 'down');

    });
  });

  $('btn-buy').addEventListener('click', triggerBuy);
  $('btn-sell').addEventListener('click', triggerSell);
  $('btn-all-buy').addEventListener('click', () => {
    if (isFx()) closeAll(); else allBuy();
  });
  $('btn-all-sell').addEventListener('click', () => { if (!isFx()) allSell(); });
  $('reset').addEventListener('click', () => {
    if (confirm('确定要重新开始吗？当前所有数据将清空。')) init(mode);
  });
  modeBtn.addEventListener('click', openDrawer);
  $('drawer').addEventListener('click', e => {
    const t = e.target;
    if (t.dataset && t.dataset.close !== undefined) { closeDrawer(); return; }
    if (t.dataset && t.dataset.bgm) { closeDrawer(); if (window.__pickBgm) window.__pickBgm(); return; }
    const card = t.closest ? t.closest('.mode-card') : null;
    if (card) setMode(card.dataset.mode);
  });
  $('restart').addEventListener('click', () => init(mode));
  qtyEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    triggerBuy();
  });

  $('sfx').addEventListener('click', () => {
    sfxOn = !sfxOn;
    $('sfx').classList.toggle('off', !sfxOn);
    $('sfx').textContent = sfxOn ? '🔊' : '🔇';
    if (sfxOn) sfx('click');
  });
  $('challenge').addEventListener('click', startChallenge);
  $('export').addEventListener('click', exportCSV);
  bindKeys();

  /* ---------- 启动 ---------- */
  init('stock');
  requestAnimationFrame(loop);

  window.__game = { get mode() { return mode; }, get pos() { return pos; }, get cash() { return cash; } };
})();

</script>
<script>
/* =========================================================
   背景音乐（本地文件，不上传）
   - 点按钮选歌；选过的会存进 IndexedDB，下次打开自动读
   - 同目录放 bgm.mp3 / bgm.m4a / bgm.ogg / bgm.wav 也能直接用
   ========================================================= */
(function(){
  const btn = document.getElementById('bgm');
  const picker = document.getElementById('bgm-file');
  const audio = new Audio();
  const EMBEDDED = "";   /* 构建时注入内嵌音轨；为空则退回本地文件/选择器 */
  const VOL = 0.32;
  audio.loop = true; audio.preload = 'auto'; audio.volume = 0;
  window.__bgmAudio = audio;          /* 调试用 */

  let ready = false, fadeTimer = null, objectUrl = null;
  const mark = on => btn.classList.toggle('on', on);

  function fade(from, to, ms, done){
    clearInterval(fadeTimer);
    const t0 = performance.now();
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      try { audio.volume = Math.max(0, Math.min(1, from + (to - from) * k)); } catch(e){}
      if(k >= 1){ clearInterval(fadeTimer); done && done(); }
    }, 30);
  }

  function attach(blob){
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(blob);
    audio.src = objectUrl; ready = true; audio.load();
  }

  function play(){
    const p = audio.play();
    if(p && p.catch) p.catch(()=>mark(false));
    fade(0, VOL, 700);
  }

  btn.addEventListener('click', () => {
    if (ready) {
      if (audio.paused) play();
      else fade(audio.volume, 0, 300, ()=>audio.pause());
      return;
    }
    if (window.Music) {                           // 内置合成 BGM
      if (Music.isPlaying()) { Music.stop(); mark(false); }
      else { Music.start(); mark(true); }
      return;
    }
    picker.click();
  });

  /* 从抽屉里换本地音乐用 */
  window.__pickBgm = () => picker.click();

  picker.addEventListener('change', () => {
    const f = picker.files && picker.files[0];
    if(!f) return;
    if (window.Music) Music.stop();
    attach(f); store(f); play();
  });

  audio.addEventListener('play',  ()=>mark(true));
  audio.addEventListener('pause', ()=>mark(false));
  audio.addEventListener('error', ()=>{ ready = false; mark(false); });

  /* ---- 记忆（失败就退化成仅本次有效） ---- */
  const DB = 'klm_bgm', STORE = 'tracks';
  function db(cb){
    try{
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => { try{ r.result.createObjectStore(STORE); }catch(e){} };
      r.onsuccess = () => cb(r.result);
      r.onerror = () => cb(null);
    }catch(e){ cb(null); }
  }
  function store(file){
    db(d => {
      if(!d) return;
      try{ d.transaction(STORE,'readwrite').objectStore(STORE).put(file,'last'); }catch(e){}
    });
  }
  function restore(){
    db(d => {
      if(!d) return;
      try{
        const g = d.transaction(STORE,'readonly').objectStore(STORE).get('last');
        g.onsuccess = () => { if(g.result && !ready) attach(g.result); };
      }catch(e){}
    });
  }

  /* ---- 同目录音频（可选） ---- */
  function probeLocal(){
    ['bgm.mp3','bgm.m4a','bgm.ogg','bgm.wav'].forEach(name => {
      if(ready) return;
      const t = new Audio();
      t.addEventListener('canplay', () => {
        if(ready) return;
        audio.src = name; ready = true;
      }, { once:true });
      t.addEventListener('error', ()=>{}, { once:true });
      t.src = name; t.load();
    });
  }

  if(EMBEDDED){ audio.src = EMBEDDED; ready = true; }
  else { restore(); probeLocal(); }
})();
</script>
